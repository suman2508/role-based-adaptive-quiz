version: "3.9"

name: role-based-adaptive-quiz

networks:
  app-net:

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    # For embeddings via pgvector later, consider: image: pgvector/pgvector:pg16
    image: postgres:16
    container_name: quiz-postgres
    environment:
      POSTGRES_DB: quizdb
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # If you add bootstrap SQL (extensions, seeds), create ./docker/initdb and uncomment:
      # - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quizdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  redis:
    image: redis:7
    container_name: quiz-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net
    profiles: ["with-redis"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiz-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quizdb
      SPRING_DATASOURCE_USERNAME: quiz
      SPRING_DATASOURCE_PASSWORD: quiz
      SPRING_PROFILES_ACTIVE: prod
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-3600000}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-}
      JAVA_OPTS: "-XX:+UseG1GC -Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Healthcheck can be enabled once curl/wget is present in the runtime image
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 10
    restart: unless-stopped
    networks:
      - app-net
